
name: CycleCast CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyclecast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python quality and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install pytest httpx ruff

      - name: Check for Python errors
        run: |
          ruff check app tests --select E9,F63,F7,F82

      - name: Run automated tests
        run: |
          python -m pytest tests -v

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CycleCast API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cyclecast-api:ci
