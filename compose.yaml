
services:
  cyclecast-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: cyclecast-api:1.0.0
    container_name: cyclecast-api

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./models:/app/models:ro

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
